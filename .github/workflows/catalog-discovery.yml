name: Catalog discovery

on:
  workflow_dispatch:
    inputs:
      max_per_query:
        description: Maximum results per configured query
        default: "20"
        required: true
  schedule:
    - cron: "17 8 1 * *"

permissions:
  contents: read

concurrency:
  group: normarchy-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install --disable-pip-version-check yt-dlp
      - run: python3 scripts/catalog_pipeline.py discover --workers 2 --max-per-query "${{ inputs.max_per_query || '20' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: normarchy-candidates
          path: catalog/candidates.json
          if-no-files-found: error

name: Catalog health

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 1"

permissions:
  contents: read

concurrency:
  group: normarchy-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install --disable-pip-version-check yt-dlp
      - run: python3 scripts/catalog_pipeline.py health --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: normarchy-health
          path: reports/catalog-health.json
          if-no-files-found: error
